ts whole `pow` section once, when its PoW\nservice starts, so this is the last moment before the first\nstart when any of it can be set without a restart \u2014 which is the\nonly reason it is in the wizard at all.\n\nOne toggle carries the step. The full form \u2014 threads, tickets\nper block, claim period, auto-claim targets \u2014 is behind\n**Mining settings**, because its defaults are what a desktop\nnode wants.\n\n![Step 4 is one toggle](images/blockchain-ui-setup-mining.png)\n\nThe dashboard opens on a full-width status hero whose headline\n*is* the state: it reads **Not started** \u2014 the operator starts\nthe node explicitly; generating or selecting a config never\nstarts one.\n\nThe line beside the headline carries the node's own explanation\nwhen something goes wrong, so a failed start shows a real cause\nrather than a generic error. Underneath it runs the lifecycle\nlane (**Started \u2192 Online**), which lights up one stage at a time\nas the node comes up.\n\n![Node view shows the config, node not started](images/blockchain-ui-node.png)\n\nNavigation is a tab bar under the node header, one tab per\nsection. Every tab is open before the node is up: a section that\ncannot answer says why, rather than being unreachable. Each one\ncarries the same banner \u2014 \"Start the node from the Node tab\", or\n\"The node is still catching up\" when it is already running \u2014 so\nthe reason is specific rather than a disabled tab the user has to\nguess at. The actions inside stay disabled either way.\n\nThis doc-test still stops here, because what the sections would\n*show* needs a node bootstrapped against a live network.\n\n**Explorer** is one section holding both halves of reading the\nchain: a lookup by block id or transaction hash on top, and under\nit the table of blocks this node has seen. A lookup replaces the\ntable until it is cleared. The table needs no node, which is why\nthe tab stays open here; the lookup does, and says so in place.\n\n**Wallet** is likewise one section rather than three: a left menu\npicks between Accounts, Transfer and Channel Deposit, which share\nthe same account list. Without a node each states why it cannot\nanswer instead of presenting a form that would fail on submit.\n\nEverything up to this point \u2014 the welcome screen, the five setup\nsteps, the round-trip into `blockchain_module`, and the node\nview \u2014 needs no network at all, which is what makes it\nreproducible.\n\n![Every section is reachable without a node](images/blockchain-ui-nav.png)\n\nLeader rewards. The two tiles are the pipeline \u2014 vouchers the\nwallet can claim, and claims sent but not yet seen on chain \u2014\nover the history of what has settled. With no node all three\nread empty, and the banner names the reason rather than leaving\na page of dashes to interpret.\n\n![Rewards says why it is empty](images/blockchain-ui-rewards-empty.png)\n\nProof-of-work, laid out like Rewards: tickets waiting, claims in\nflight, and what mining has actually paid. The two tabs share\none claim ledger and one delegate \u2014 the difference is only which\nkind of claim each is scoped to.\n\n![Mining shows tickets and its own history](images/blockchain-ui-mining-empty.png)\n\nOne tab, three sections picked from the left menu. All three\nshare the same account list, so all three are equally empty\nwithout a node \u2014 and each says so rather than offering a form\nthat would fail on submit.\n\n![Wallet holds three sections behind one tab](images/blockchain-ui-wallet-empty.png)\n\nThe lookup is always on top; the block table underneath is the\nresting state. Both need a node \u2014 the lookup to answer, the\ntable to have anything to list \u2014 and each says so in its own\nplace rather than through one banner for the page.\n\n![Explorer renders its lookup and block table](images/blockchain-ui-explorer-empty.png)\n\nSettings is the one section that needs no node in any state: it\nedits files on disk, which is what you do *before* starting one.\nThat is why it carries no banner while every other tab does.\n\n![Settings renders without a node at all](images/blockchain-ui-settings.png)"}, {"execs": [], "md": "## What this does not cover\n\nThis doc-test stops at the node view, because everything past it is gated\non a running node:\n\n- **Sections are reachable but have nothing to show**: every tab opens\n  without a node, and each says why it cannot answer. What they would\n  display \u2014 balances, vouchers, tickets, claim history \u2014 needs a running\n  node, so only the empty states are exercised here. Settings is the\n  exception: it edits config files on disk and needs no node at all.\n- **Bootstrapping and syncing** need reachable peers speaking a matching\n  chainsync protocol version. When they do not match the node fails Initial\n  Block Download with `AllPeersFailed` \u2014 a real failure, but driven by\n  network state rather than by this repository.\n- **Balances and transactions** need a chain that is progressing.\n\nNote the generate form has no `skip_ibd` control, so a config produced\nthrough the UI always carries bootstrap peers. That is the single change\nthat would unlock a UI end-to-end doc-test: expose `skip_ibd` in the form\n(the module already accepts it), and the UI could start a peerless node the\nsame way the module's\n[`blockchain-module-runtime`](https://github.com/logos-blockchain/logos-blockchain-module/blob/master/doctests/blockchain-module-runtime.test.yaml)\ndoc-test does \u2014 at which point the operation panels become reachable and\nassertable.\n\nNavigation here goes through `objectName` handles (`onboardingView`,\n`onboardingAdvanceButton`, the per-step cards) rather than by clicking\ncaptions. That is deliberate: the wizard's primary button is one control\nwhose caption changes per step, so addressing it by text would mean a\ndifferent selector on every screen \u2014 and the step cards repeat words the\nbody copy also uses."}]}], "version": 1}</scrip <script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
</body>
</html>
