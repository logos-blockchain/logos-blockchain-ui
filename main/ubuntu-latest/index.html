AAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAgAgAAAIIIAAAACCIAAAAgiAAAAIAg/wOJX1jfFcfx5QAAAABJRU5ErkJggg==)\n\nNavigation is a tab bar under the node header, one tab per\nsection. Every tab is rendered, but only **Dashboard**,\n**Explorer** and **Settings** are usable before the node is up:\nthe rest are disabled until it runs. That is why this doc-test\nstops here \u2014 the wallet, rewards and mining sections cannot be\nreached without first bootstrapping a node against a live network.\n\n**Explorer** is one section holding both halves of reading the\nchain: a lookup by block id or transaction hash on top, and under\nit the table of blocks this node has seen. A lookup replaces the\ntable until it is cleared. The table needs no node, which is why\nthe tab stays open here; the lookup does, and says so in place.\n\n**Wallet** is likewise one section rather than three: a left menu\npicks between Accounts, Transfer and Channel Deposit, which share\nthe same account list and are all equally dead without a node.\n\nEverything up to this point \u2014 the chooser, the generate form, the\nround-trip into `blockchain_module`, and the dashboard \u2014 needs no\nnetwork at all, which is what makes it reproducible.\n\n![Most sections are gated on a running node](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABAAAAAPoCAIAAADPzxu1AAAACXBIWXMAAA7EAAAOxAGVKw4bAAAgAElEQVR4nOzdd1wUd/4/8M/s7uwuu9SlLNKLCFhARTFYsYsltmhiNImeKWqaicmdJneX9kvyvZTLJTkTTTTG2ONFjS12Y8WOIoiFunSQsuwusG3m98eYubmlCEgR9vX8g8fM7Gc+89md3eHznvkUSq1WEwAAAAAAsA+iji4AAAAAAAC0HwQAAAAAAAB2BAEAAAAAAIAdQQAAAAAAAGBHEAAAAAAAANgRBAAAAAAAAHYEAQAAAAAAgB1BAAAAAAAAYEcQAAAAAAAA2BEEAAAAAAAAdgQBAAAAAACAHUEAAAAAAABgRxAAAAAAAADYEQQAAAAAAAB2BAEAAAAAAIAdkXR0AQAAAAC6PoqiHB0dnZycZDKZRCKhaVok6jr3YRmGMZvNFovFaDTqdDq9Xs+ybJseUSqiBvmq4gPcu7sqPRVSL4VMQYvb9IjtqdpsLak2llab0isNv2vKzueXm5jW/DwptVrditkBAAAAgBBN056eni4uLiaTyWAwGI1Gi8VisVgYhunoorUakUgkkUgkEolMJlMqlVKpVKvVlpaWms3mVj+WWilb0i9oUqi6K9X4G1dttu7LKF6ZlF1iMLZKhggAAAAAANoERVFeXl4qlUqr1VZWVlqt1o4uUTsRi8Wurq4uLi7l5eUlJSWt9TRAJhYt6hc0v4+/TNx1Hp40ndHK/Hg9d1VSttH6oKEjAgAAAACA1kfTdEBAgNVqLS0ttVgsHV2cDiCRSDw9PcVisUajefBHAZ4K2b/H9u7j6dwqZeu8rpdWvXQ4pbT6gR4FiB0dHVurQAAAAABACJHL5SEhIXq9vrS0tCs19WkWhmH0er1EIunWrZter3+QKChc5bh+Ur8QV2UrFq+TUitlE0O8zhVUlNWYWpwJAgAAAACA1kTTdHBw8N27d7VabUeXpePV1NRYLBZfX1+tVtuyWMhLKftpUj+1UtbqZeukHKWSkQEe+zNLqs0tbFRmjy2oAAAAANoIRVEBAQFVVVV6vb6jy/Kw0Ov1Wq02ICCAoqjm7isTi/49po8Xav//S62U/Xts7xb3hcATAAAAAIBWo1arxWJxaWlpRxfk4VJTU6NUKmUymcFgaNaOL8UETwz1aqNSdWpqpYyiqPMFFS3YF08AAAAAAFoHTdMqlQq1/3qVlpa6u7vTNN30XdRK2fw+/m1XpM5ufh//lj0bQQAAAAAA0Do8PT21Wq19jvlzXxaLpbKy0tPTs+m7LOkXZJ8jfjaRTCxa0i+oBTviMwUAAABoBRRFubi4VFZWdnRBHl6VlZUuLi5N7AkgFYsmd8do9fcxOVQtFTW7ZwUCAAAAAIBW4OjoaDKZ7Ge2rxawWq0mk6mJHVAH+bg5SOxlrt8WU9DiWB9Vc/fqlAHA9u3bi+ooLCzMzMy8cuXKtm3bli5d6ufnZ7PX4MGD+cQ7d+5st9K+8cYb/HE/+eST1s18586dfOYJCQmtmzn538K//PLLrZv5a6+9xmd+9uxZuVxeb7Lo6Gg+WVJSUuuWge  failure, but driven by\n  network state rather than by this repository.\n- **Balances and transactions** need a chain that is progressing.\n\nNote the generate form has no `skip_ibd` control, so a config produced\nthrough the UI always carries bootstrap peers. That is the single change\nthat would unlock a UI end-to-end doc-test: expose `skip_ibd` in the form\n(the module already accepts it), and the UI could start a peerless node the\nsame way the module's\n[`blockchain-module-runtime`](https://github.com/logos-blockchain/logos-blockchain-module/blob/master/doctests/blockchain-module-runtime.test.yaml)\ndoc-test does \u2014 at which point the operation panels become reachable and\nassertable.\n\nNavigation here goes through `call_method` on `objectName` handles\n(`blockchainRoot`, `configChoiceView`, `generateConfigView`) rather than by\nclicking captions. That is deliberate: the chooser's \"Generate config\"\nbutton and the form's submit button share a caption, so click-by-text\ncannot address them unambiguously."}]}], "version": 1}</script>
<script>
  const DATA = JSON.parse(document.getElementById("report-data").textContent);
  if (window.marked) { marked.setOptions({ gfm: true, breaks: false }); }
  const mdToHtml = (s) => window.marked ? marked.parse(s || "") : ("<pre>" + (s || "") + "</pre>");

  const sum = DATA.summary;
  document.getElementById("summary").innerHTML =
    `<span class="pill pass">${sum.passed} passed</span> ` +
    (sum.failed ? `<span class="pill fail">${sum.failed} failed</span> ` : "") +
    (sum.skipped ? `<span class="pill skip">${sum.skipped} skipped</span>` : "");

  const picker = document.getElementById("picker");
  DATA.tutorials.forEach((t, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = t.meta.name; picker.appendChild(o);
  });

  function execHtml(e) {
    const badge = `<span class="badge ${e.status}">${e.status.toUpperCase()}</span>`;
    const kind = `<span class="kind">${e.kind}${e.platform ? " · " + e.platform : ""}${e.exit_code !== undefined ? " · exit " + e.exit_code : ""}</span>`;
    let h = `<div class="exec"><div class="exec-head">${badge}${kind}</div>`;
    if (e.note) h += `<div class="note">${escapeHtml(e.note)}</div>`;
    if (e.cmd) h += `<pre class="cmd">${escapeHtml(e.cmd)}</pre>`;
    const out = (e.output || "").trim();
    if (out) {
      const long = out.split("\n").length > 12;
      if (long) {
        h += `<details><summary>output (${out.split("\n").length} lines)</summary><pre class="output">${escapeHtml(out)}</pre></details>`;
      } else {
        h += `<pre class="output">${escapeHtml(out)}</pre>`;
      }
    }
    h += `</div>`;
    return h;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function render(idx) {
    const t = DATA.tutorials[idx];
    const main = document.getElementById("main");
    main.innerHTML = "";
    const h = document.createElement("div");
    h.className = "tutorial-title";
    h.textContent = t.meta.name + "  —  " + t.meta.platform;
    main.appendChild(h);

    t.rows.forEach(row => {
      const isStructural = row.execs.length === 0 &&
        (/^#\s|^##\s/.test(row.md.trim()));
      const div = document.createElement("div");
      const hasExec = row.execs.length > 0;
      const hasFail = row.execs.some(e => e.status === "fail");
      div.className = "row" + (hasExec ? "" : (isStructural ? " section" : " preamble")) +
        (hasFail ? " has-fail" : "");

      const left = document.createElement("div");
      left.className = "col left";
      left.innerHTML = `<div class="md">${mdToHtml(row.md)}</div>`;
      div.appendChild(left);

      if (hasExec || !isStructural) {
        const right = document.createElement("div");
        right.className = "col right";
        if (hasExec) {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            row.execs.map(execHtml).join("");
        } else {
          right.innerHTML = `<div class="col-label">Executed</div>` +
            `<div class="empty">No commands run for this step.</div>`;
        }
        div.appendChild(right);
      }
      main.appendChild(div);
    });

    addAnchors(main, slug(t.meta.name));
  }

  function slug(s) {
    return String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  // Octicon "link" — the same glyph GitHub puts next to markdown headings.
  const LINK_ICON =
    '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d=' +
    '"M7.775 3.275a.75.75 0 0 0 1.06 1.06l1.25-1.25a2 2 0 1 1 2.83 2.83l-2.5 2.5a2 2 0 0 1-2.83 0 ' +
    '.75.75 0 0 0-1.06 1.06 3.5 3.5 0 0 0 4.95 0l2.5-2.5a3.5 3.5 0 0 0-4.95-4.95l-1.25 1.25Zm-4.69 ' +
    '9.64a2 2 0 0 1 0-2.83l2.5-2.5a2 2 0 0 1 2.83 0 .75.75 0 0 0 1.06-1.06 3.5 3.5 0 0 0-4.95 0l-2.5 ' +
    '2.5a3.5 3.5 0 0 0 4.95 4.95l1.25-1.25a.75.75 0 0 0-1.06-1.06l-1.25 1.25a2 2 0 0 1-2.83 0Z"></path></svg>';

  // Give every heading a stable slug id (deduplicated the way GitHub does, with
  // -1/-2 suffixes) and a permalink whose href is "#<tutorial>/<heading>".
  function addAnchors(container, tutSlug) {
    const used = new Map();
    const nodes = container.querySelectorAll(
      ".tutorial-title, .md h1, .md h2, .md h3, .md h4, .md h5, .md h6"
    );
    nodes.forEach(node => {
      const text = node.textContent.trim();
      const isTitle = node.classList.contains("tutorial-title");
      let href = "#" + tutSlug;
      if (!isTitle) {
        const base = slug(text) || "section";
        const n = (used.get(base) || 0) + 1;
        used.set(base, n);
        node.id = n > 1 ? base + "-" + n : base;
        href += "/" + node.id;
      }
      node.classList.add("heading-anchored");
      const a = document.createElement("a");
      a.className = "anchor";
      a.href = href;
      a.title = "Copy link to this section";
      a.setAttribute("aria-label", "Permalink: " + text);
      a.innerHTML = LINK_ICON;
      node.insertBefore(a, node.firstChild);
    });
  }

  let toastTimer = null;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
  }

  // navigator.clipboard needs a secure context; reports are often opened over
  // file://, so fall back to the old execCommand path there.
  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(
        () => toast("Link copied"),
        () => toast(text)
      );
      return;
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    toast(ok ? "Link copied" : text);
  }

  function scrollToId(id) {
    if (!id) { window.scrollTo(0, 0); return; }
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "start" });
    el.classList.remove("flash");
    void el.offsetWidth;  // restart the animation on a repeat click
    el.classList.add("flash");
  }

  document.addEventListener("click", ev => {
    const a = ev.target.closest && ev.target.closest("a.anchor");
    if (!a) return;
    ev.preventDefault();
    const href = a.getAttribute("href");
    copyText(location.href.split("#")[0] + href);
    if (location.hash === href) scrollToId(a.parentNode.id);
    else location.hash = href;  // hashchange scrolls
  });

  // "#<tutorial>" (name, slug, or index) optionally followed by "/<heading>".
  function parseHash() {
    const raw = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (!raw) return { idx: 0, frag: "" };
    const cut = raw.indexOf("/");
    const tut = cut >= 0 ? raw.slice(0, cut) : raw;
    const frag = cut >= 0 ? raw.slice(cut + 1) : "";
    if (/^\d+$/.test(tut) && +tut < DATA.tutorials.length) return { idx: +tut, frag };
    const i = DATA.tutorials.findIndex(
      t => slug(t.meta.name) === tut || t.meta.name === tut
    );
    if (i >= 0) return { idx: i, frag };
    // No tutorial matched: treat a bare hash as a heading in the current one.
    return { idx: currentIdx >= 0 ? currentIdx : 0, frag: cut >= 0 ? frag : raw };
  }

  let currentIdx = -1;
  function show(idx, frag) {
    if (idx !== currentIdx) {
      picker.value = idx;
      render(idx);
      currentIdx = idx;
    }
    if (frag) requestAnimationFrame(() => scrollToId(frag));
  }
  picker.addEventListener("change", () => {
    location.hash = slug(DATA.tutorials[+picker.value].meta.name);
    show(+picker.value);
  });
  window.addEventListener("hashchange", () => {
    const h = parseHash();
    show(h.idx, h.frag);
  });
  const initial = parseHash();
  show(initial.idx, initial.frag);
  // Inlined screenshots have no intrinsic size until decoded, so the first
  // scroll can land short; re-anchor once everything has loaded.
  if (initial.frag) {
    window.addEventListener("load", () => scrollToId(initial.frag), { once: true });
  }
</script>
